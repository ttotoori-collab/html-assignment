<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Flex Basics</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 24px;
  }

  .student {
    font-size: 20px;
    margin: 0 0 24px;
  }

  /* CSS: 부모에게 flex 지시 */
  .container {
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  .container > div {
    padding: 16px 24px;
    border-radius: 6px;
    color: white;          /* 글자색 (배경이 어두우니까) */
  }

  /* 박스마다 다른 배경색 */
  .container > div:nth-child(1) { background-color: #14b3c9; }
  .container > div:nth-child(2) { background-color: #107886; }
  .container > div:nth-child(3) { background-color: #121d36; }
</style>
</head>
<body>
  <!-- 학번 / 이름 -->
  <h1 class="student">2601926 김세란</h1>

  <!-- HTML: 박스 3개를 감싸는 부모 -->
  <div class="container">
    <div>박스1</div>
    <div>박스2</div>
    <div>박스3</div>
  </div>
</body>
</html>
